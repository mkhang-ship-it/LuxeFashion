[build]
builder = "RAILPACK"
buildCommand = "npm ci --prefix resources/figma && npm run build --prefix resources/figma && composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache && php artisan view:cache"

[deploy]
startCommand = "php artisan migrate --force && php artisan storage:link && php -S 0.0.0.0:${PORT:-8000} -t public"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environment]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stderr"
CACHE_DRIVER = "file"
SESSION_DRIVER = "file"
QUEUE_CONNECTION = "sync"
